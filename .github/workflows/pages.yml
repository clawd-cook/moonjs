name: Deploy website to GitHub Pages

# Publishes website/ (Rspress SSG) to GitHub Pages at
# https://clawd-cook.github.io/moonjs/.
# Spec: .trellis/spec/cicd/spec-process-cicd-pages.md
#
# Prereq (one-time setup): repository Settings -> Pages -> Source =
# "GitHub Actions". This workflow does not configure that setting itself.

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # build — install pnpm deps, run rspress build, upload as Pages artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: pnpm install
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Rspress build
        working-directory: website
        run: pnpm build

      - name: Verify build output
        run: |
          set -euo pipefail
          if [ ! -f website/doc_build/index.html ]; then
            echo "::error::website/doc_build/index.html missing after build" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/doc_build

  # ---------------------------------------------------------------------------
  # deploy — publish the artifact to the github-pages environment.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
